services:
  app:
    build: .
    restart: unless-stopped
    # Jalankan sebagai root di dalam kontainer agar memiliki izin tulis ke bind-mount ./data/whatsapp pada kartu SD STB
    user: "0:0"
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      # Data disimpan di folder ./data/whatsapp di dalam kartu SD
      - ./data/whatsapp:/app
      - ./.env:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    # Direkomendasikan MariaDB untuk STB agar ringan dan native support ARM
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # Database disimpan di folder ./data/mysql di dalam kartu SD
      - ./data/mysql:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    # Optimasi RAM khusus STB (maksimal memori database ~128MB)
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=50
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
